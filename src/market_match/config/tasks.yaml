##############################################
# --------- RESEARCH DEPARTMENT --------------
##############################################
find_ai_sports_news:
  description: >
    Search the web for {news_per_topic} recent news items related to artificial intelligence in the sports industry.
    The news must be recent (ideally less than 7 days old). The current date is {edition_date}.
    Search for news related to AI applications in sports, such as:
    - Research papers on AI for sports analytics, performance optimization;
    - New methods or techniques using AI in sports science, training, or injury prevention;
    - New models, algorithms or tools for sport prediction that advance the state of the art;
    - Major regulatory changes affecting the use of AI in sports;
    - Recent examples of AI adoption in sports industry with measurable impact on teams, athletes, or fans;
    Compare multiple sources to ensure credibility and depth of the news, since the topic will be covered in-depth in the newsletter article.
    Prioritize official announcements, credible media outlets, technical blog posts, and measurable results.
    Ignore marketing announcements, unverified rumors, and topics already covered in previous editions.
    Ignore news already covered in previous editions. You MUST use the 
    read_published_news_history tool to check past editions and make sure to not use news that were already covered.
    Return a list of {news_per_topic} recent news, each with title, url, published_at, source and article_content.
  expected_output: >
    A list of {news_per_topic} recent news items related to AI in the sports industry.
  output_file: editions/edition_{edition_number}_{edition_date}/search_sports_news.json
  agent: ai_sports_news_scout

find_ai_finance_news:
  description: >
    Search the web for {news_per_topic} recent news stories about artificial intelligence in the finance industry.
    The news must be recent (ideally less than 7 days old). The current date is {edition_date}.
    Search for news related to AI applications in finance, such as:
    - Research papers on AI applied to finance, financial markets, or investment analysis;
    - New methods or techniques using AI in finance, such as risk assessment, fraud detection, or algorithmic trading;
    - New models, algorithms or tools for financial forecasting or market prediction that advance the state of the art;
    - Major regulatory changes affecting the use of AI in finance or financial services;
    - Recent examples of AI adoption in the finance industry with measurable impact on firms, investors, or markets.
    Compare multiple sources to ensure credibility and depth of the news, since the topic will be covered in-depth in the newsletter article.
    Prioritize official announcements, credible media outlets, technical blog posts, and measurable results.
    Ignore marketing announcements, unverified rumors, and topics already covered in previous editions.
    Ignore news already covered in previous editions. You MUST use the 
    read_published_news_history tool to check past editions and make sure to not use news that were already covered.
    Return a list of {news_per_topic} recent news, each with title, url, published_at, source and article_content.
  expected_output: >
    A list of {news_per_topic} recent news stories related to AI in finance.
  output_file: editions/edition_{edition_number}_{edition_date}/search_finance_news.json
  agent: ai_finance_news_scout

find_ai_economy_news:
  description: >
    Search the web for {news_per_topic} recent news stories about artificial intelligence and its impact on the economy.
    The news must be recent (ideally less than 7 days old). The current date is {edition_date}.
    Search for news related to AI applications in the economy, such as:
    - Research papers on AI applied to economics, economic modeling, or macroeconomic analysis;
    - New methods or techniques using AI to study economic behavior, policy impacts, or economic forecasting;
    - Case studies where AI is used to support economic decision-making by governments, central banks, or international organizations;
    - Major regulatory changes affecting the use of AI in economic analysis, public policy or public decision-making;
    - Recent examples of AI adoption in the economy with measurable impact on labor markets, or productivity.
    Compare multiple sources to ensure credibility and depth of the news, since the topic will be covered in-depth in the newsletter article.
    Prioritize official announcements, credible media outlets, technical blog posts, and measurable results.
    Ignore marketing announcements, unverified rumors, and topics already covered in previous editions.
    Ignore news already covered in previous editions. You MUST use the 
    read_published_news_history tool to check past editions and make sure to not use news that were already covered.
    Return a list of {news_per_topic} recent news, each with title, url, published_at, source and article_content.
  expected_output: >
    A list of {news_per_topic} recent news stories about AI and the economy.
  output_file: editions/edition_{edition_number}_{edition_date}/search_economy_news.json
  agent: ai_economy_news_scout

find_ai_research_papers:
  description: >
    Search academic paper sources for {news_per_topic} recent research papers or technical reports
    about artificial intelligence applied to sports.
    The papers must be recent (ideally submitted or published in the last 14 days). The current date is {edition_date}.

    Use the arXiv search tools or SerperDevTool with targeted queries to search for 
    research papers related to AI applications in sports, such as
    sports prediction, financial modeling, algorithmic trading or economic forecasting

    Prioritize papers with:
    - new models, benchmarks, or architectures applied to sports
    - significant empirical results or real-world applications
    - clear domain relevance

    Prioritize major researchs, institutions, or labs, and papers that have received attention from credible sources.
    Ignore marketing announcements, unverified rumors, and topics already covered in previous editions.
    Ignore news already covered in previous editions. You MUST use the 
    read_published_news_history tool to check past editions and make sure to not use news that were already covered.
    Return a list of {news_per_topic} recent news, each with title, url, published_at, source and article_content.
  expected_output: >
    A list of {news_per_topic} recent research papers about AI applied to sports.
  output_file: editions/edition_{edition_number}_{edition_date}/search_research_papers.json
  agent: ai_research_paper_scout

enrich_news_research:
  description: >
    You are providing a list of recent news stories about artificial intelligence: 
    {news_per_topic} about the impact of AI on sport, {news_per_topic} about the impact of AI on finance, {news_per_topic} about the impact of AI on the economy,
    and {news_per_topic} recent academic research papers about AI applied to sports, finance, or economics.

    Review all the news items selected in the previous tasks and enrich each of them with additional source.
    For each news item, find 1 additional source or article covering the same topic, the same event, or the same primary announcement.

    The additional source must be different from the original article. Avoid duplicates, near-identical copies, or simple reposts.
    Choose an additional source that provides complementary details useful for writing the newsletter article, such as:
    - additional figures or data points
    - quotes
    - regulatory perspective
    - market or economic perspective
    - technical perspective
    - reactions from industry actors
    - limitations, risks, or measurable impacts

    You may use the read_website_content tool to read the content of the articles.
    Make sure the choosen sources are valid sources.
    The content of the additional source MUST be different from the original source and provide complementary information.
    You MUST return all news items that was provided, enriched with an additional source.
    Return a list of {news_per_topic} recent news, each with the original title, topic (sport, finance, economy, or research), url, published_at, source and article_content,
    enriched with the additional source (title, url, published_at, source and article_content).
  expected_output: >
    A list of {news_preliminary_total} recent news stories with the original information enriched with additional sources.
  output_file: editions/edition_{edition_number}_{edition_date}/enriched_news_research.json
  agent: news_enricher
  context:
    - find_ai_sports_news
    - find_ai_finance_news
    - find_ai_economy_news
    - find_ai_research_papers

enrich_news_market_context:
  description: >
    You are providing a list of recent news stories about artificial intelligence: 
    {news_per_topic} about the impact of AI on sport, {news_per_topic} about the impact of AI on finance, {news_per_topic} about the impact of AI on the economy,
    and {news_per_topic} recent academic research papers about AI applied to sports, finance, or economics.

    A previous agent already enriched all news items with an additional source providing complementary details about the same announcement. 
    Your task is now to add a second additional source for each news item, but this time focused on providing broader market context rather than the exact same announcement.

    Review all the news items selected in the previous tasks and add one extra source per item focused on
    broader market context rather than the exact same announcement.

    The source must remain connected to the same domain and core theme of the original news,
    but should provide a wider-angle perspective useful for a dedicated "market context" section
    in a future newsletter article.
    For each news item, find exactly 1 additional source that helps explain the external environment,
    such as:
    - competitor positioning and rival initiatives
    - market structure and industry dynamics
    - strategic context around adoption, differentiation, and timing
    - ecosystem constraints, dependencies, or power shifts

    You may use the read_website_content tool to read the content of the articles.
    Make sure the choosen sources are valid sources.
    The content of the additional source MUST be different from the original source and provide complementary information.
    You MUST return all news items that was provided, with an additional source and the market context source.
    Return a list of {news_per_topic} recent news, each with the original title, topic (sport, finance, economy, or research), url, published_at, source and article_content,
    enriched with the additional source (title, url, published_at, source and article_content) 
    and the market context source (title, url, published_at, source and article_content).
  expected_output: >
    A list of {news_preliminary_total} recent news stories with the original information enriched, the additional sources, and the market context source.
  output_file: editions/edition_{edition_number}_{edition_date}/market_context_news_research.json
  agent: market_context_researcher
  context:
    - enrich_news_research

select_best_news:
  description: >
    Review all the proposed news items and select the {news_to_keep}
    best news for a future newsletter about the impact of AI in the sports industry,
    the finance industry, the broader economy, and recent AI research papers
    applied to sports, finance, or economics.

    The target audience consists of readers passionate about technology,
    artificial intelligence, sports, finance, and economics.

    The selected news must be:
    - recent;
    - credible;
    - sufficiently deep;
    - technically interesting when relevant;
    - useful for a high-quality newsletter;
    - relevant for understanding the real impact of AI on sports, finance, the economy, or research;

    Keep exactly {news_to_keep} news, with at least one news about sports, one news about finance, and one news about the economy.
    Research papers may be selected in addition to or instead of general news items when they are exceptional.
    Choose the best {news_to_keep} news and reorder them from the best to the least good.
    Avoid redundant news or news that are too similar to each other.
    Avoid topics that are too weak, overly promotional, or too general.

    You MUST use the read_website_content tool to consult the content of a news article, the additional_sources, and the market_context_source. 
    You MUST select exactly {news_to_keep} news.
    You MUST use the read_published_news_history tool to check past editions and make sure to not use news that were already covered.

    Return a structured list of the {news_to_keep} best news selected for the newsletter, with all their sources and content.
    The output should have this structure:
    [
      {
        "title": str,
        "topic": str, # "sport", "finance", "economy", or "research"
        "url": str,
        "article_content": str,
        "published_at": str,
        "source": str,
        "additional_sources": [
          {
            "title": str,
            "url": str,
            "article_content": str,
            "published_at": str,
            "source": str,
          }
        ],
        "market_context_source": {
          "title": str,
          "url": str,
          "article_content": str,
          "published_at": str,
          "source": str,
        }
      },
      ...
    ]
  expected_output: >
    A structured list of the {news_to_keep} best news selected for the newsletter.
  output_file: editions/edition_{edition_number}_{edition_date}/selected_news.json
  agent: news_selector
  context:
    - enrich_news_market_context

##############################################
# ---------- WRITING DEPARTMENT --------------
##############################################

extract_news_item:
  description: >
    From the selected news list, extract ONLY news item number {news_no} (1-based index)
    and return it as a complete object.
    Do not summarize, truncate, or modify the item in any way.
    Return the full EnrichedNewsItem object as-is.
  expected_output: >
    The complete object for news item number {news_no} from the selected news list.
  agent: news_item_extractor
  output_file: editions/edition_{edition_number}_{edition_date}/news_{news_no}_selected.json

write_news_article_content:
  description: >
    Write a comprehensive newsletter article for the provided news item.

    Use the selected main news item, its additional_sources, and its market_context_source
    to produce a detailed, well-researched article with structured sections.

    Use ScrapeWebsiteTool to read the actual content from the URLs in the original news item
    and all additional_sources (including the market_context_source) to get full context.

    The article must have four clear sections:
    1. **essentials**: A 1-2 sentence summary of the news.
    2. **in_practice**: A brief paragraph (3-4 sentences) describing the real-world implications of the news.
    3. **breakdown**: A short paragraph (4-5 sentences) providing broader market context.
       Use market_context_source to explain how the news fits in the larger market,
       competitive landscape, and external environment. Integrate information naturally, and when citing, use neutral phrasing.
    4. **whats_at_stake**: A short paragraph (4-5 sentences) analyzing concrete impacts.
       Identify potential winners and losers. Include bullet points if helpful.

    Requirements:
    - Output as a JSON object with the four sections
    - All text in French
    - No invented facts; use only provided sources
    - Consult all available sources via ScrapeWebsiteTool for depth

    The article should be substantive but concise, richer than a summary,
    and grounded in the provided research.
  expected_output: >
    A object with four sections (essentials, in_practice, breakdown, whats_at_stake)
    for the provided news item.
  agent: article_writer
  output_file: editions/edition_{edition_number}_{edition_date}/news_{news_no}_article_fr.json

write_news_title:
  description: >
    Write a concise title for news item
    based on the article content just written.

    Your title should:
    - Capture the central angle of the article
    - Be concrete, clear, and engaging
    - Avoid clichés, hype, and generic marketing language
    - Stay grounded in the article content
    - Be in French
    - Be 5-10 words in length

    Output only the title text, no JSON, no markdown.
  expected_output: >
    A plain text concise 5-10 word French title for the news item.
  agent: title_writer
  output_file: editions/edition_{edition_number}_{edition_date}/news_{news_no}_title_fr.txt
  
write_news_intro:
  description: >
    Write a single-sentence introduction for news item
    based on the article content just written.

    Your introduction should:
    - Capture the essence of the article in one compelling sentence
    - Be engaging and draw readers in
    - Avoid clichés and marketing speak
    - Be grounded in the article content
    - Do not repeat text from the article

    Output only the text of the introduction, no JSON, no markdown.
  expected_output: >
    A plain text single sentence introduction in french for news item.
  agent: intro_writer
  output_file: editions/edition_{edition_number}_{edition_date}/news_{news_no}_intro_fr.txt

write_news_verdict:
  description: >
    Write an editorial opinion / verdict for the news story based on the content of the article.

    Your verdict must take a clear position and present a strong, well-argued point of view.
    You must provide a clear editorial perspective on why this news matters and acknowledge
    the opportunities and risks when relevant.

    Return only the verdict text, without JSON or markdown.
  expected_output: >
    A plain text editorial opinion / verdict (1 to 2 sentences).
  agent: verdict_writer
  output_file: editions/edition_{edition_number}_{edition_date}/news_{news_no}_verdict_fr.txt

write_newsletter_intro:
  description: >
    Based on all written article contents, write the newsletter introduction
    as a structured object with keys intro_sentence and intro_bullets.

    intro_sentence rules:
    - Start EXACTLY with: "Dans l'edition d'aujourd'hui de Market & Match,"...
    - Must be a single sentence (no list, no line break)

    intro_bullets rules:
    - Exactly one bullet per written article
    - Each bullet must be one short, punchy sentence fragment (5 to 10 words)
    - No repetition between bullets

    Output constraints:
    - Return a valid structured object with:
      - intro_sentence (str)
      - intro_bullets (list[str])
    - All text in French
    - Use only provided article contents
  expected_output: >
    A structured French newsletter introduction object with intro_sentence and intro_bullets.
  agent: newsletter_intro_writer
  output_file: editions/edition_{edition_number}_{edition_date}/newsletter_intro_fr.json

##############################################
# ---------- MARKETING DEPARTMENT ------------
##############################################

write_image_prompt:
  description: >
    Create an English image prompt for the current article to generate a thumbnail image
    with Gemini Nano Banana 2.

    Requirements:
    - Landscape orientation
    - Reflect the core story and mood of the article
    - Include concrete visual composition cues (scene, subject, camera framing, lighting)

    The image could be a literal representation of the news, a graph, a comic, a table, as long as it is visually engaging and relevant.

    Avoid futurist styles

    Return only the image prompt text in plain English, without JSON or markdown.
  expected_output: >
    A plain text English image prompt for one article thumbnail.
  agent: image_prompt_writer
  output_file: editions/edition_{edition_number}_{edition_date}/image_prompt_news_{news_no}.txt

write_newsletter_title:
  description: >
    Based on all {news_to_keep} selected and written news articles,
    create a catchy, memorable title for the newsletter edition.

    Your title should:
    - Be 10-20 words in length
    - Reflect the main themes and spirit of the edition
    - Be engaging and appealing to readers interested in AI, technology, sports, finance, and economics
    - Avoid generic or overused phrases
    - Capture what makes this edition unique

    Here some examples of good newsletter titles:
    - "Market & Match #5 - Anthropic contre le gouvernement américain, la transformation de Nano Banana, Frontier Agent Management, les solutions mathématiques de Google"
    - "Market & Match #6 - Modèles de raisonnement autonome, ChatGPT ajoute des publicités, accord d'Apple avec Google, génération 3D Pronto"
    - "Market & Match #7 - LLM vont à la confession, recherche scientifique automatisée, ce que veulent les utilisateurs de Copilot, raisonnement pour moins"

    The title should be in plain text, without formatting or markdown, in French.    
  expected_output: >
    A plain text title (10-20 words) for the newsletter edition.
  agent: newsletter_title_writer
  output_file: editions/edition_{edition_number}_{edition_date}/newsletter_title_fr.txt

validate_newsletter_html:
  description: >
    Validate the French newsletter HTML and fix formatting issues if needed.

    IMPORTANT:
    - First, call the tool `assemble_newsletter_html` to build deterministic HTML from edition artifacts.
    - Then validate and, if needed, correct the resulting HTML.
    - The final output must come from this task and represent the validated HTML.

    Validation requirements:
    - Ensure valid and coherent HTML structure. The output will be inserted into a <body><main></main></body> block of a webpage, so it must be a valid fragment that can be directly rendered.
    - Fix malformed list content into proper <ul>/<li> markup when needed
    - Preserve all original content and ordering
    - Keep article blocks and sources readable

    Return only the validated HTML content, without JSON wrapping or markdown.
  expected_output: >
    A validated and corrected French newsletter HTML document.
  agent: newsletter_html_validator
  output_file: editions/edition_{edition_number}_{edition_date}/newsletter_fr.html

translate_newsletter_title:
  description: >
    Translate the French newsletter title (newsletter_title_fr) to English.

    Translation requirements:
    - Keep meaning, tone, and clarity
    - Maintain the catchy and engaging spirit
    - 5-10 words in length

    Return only the translated title text in plain English, without JSON or markdown.
  expected_output: >
    Translated newsletter title in English.
  agent: newsletter_translator
  output_file: editions/edition_{edition_number}_{edition_date}/newsletter_title_en.txt

translate_newsletter_html:
  description: >
    Translate the validated French newsletter HTML to English.

    Translation requirements:
    - Preserve HTML structure and tags exactly
    - Keep meaning, tone, and clarity
    - Do not remove sections or links
    - Translate all French text content to fluent English

    Return only the translated HTML content, without JSON wrapping or markdown.
  expected_output: >
    Translated newsletter HTML in English.
  agent: newsletter_translator
  output_file: editions/edition_{edition_number}_{edition_date}/newsletter_en.html

write_facebook_post:
  description: >
    Write a French Facebook post to share Market & Match newsletter edition #{edition_number}.

    STYLE REQUIREMENTS (ALL PLATFORMS):
    - Write as someone sharing a discovery with followers, not as a press release
    - Start with a personal phrase like: "Cette semaine dans Market & Match #{edition_number},"
    - Natural, direct tone, as if sharing a discovery with your followers
    - Include a few relevant hashtags at the end

    FACEBOOK-SPECIFIC:
    - Mention "Lien en commentaires 👇"
    - Include a few emojis throughout
    - 2 to 5 sentences max
    - Summarize news items as bullet points (10-20 words per news item)

    Here is an example of a good Facebook post:
    ```
    Cette semaine dans Market & Match #2, nous explorons comment l'IA transforme l'arbitrage du Mondial, l'engagement des fans de baseball et les modèles de crédit de Goldman Sachs à Pékin.

    - ⚽ L'arbitrage du futur : Pour la Coupe du Monde 2026, la FIFA mise sur l'IA afin d'optimiser les décisions arbitrales et garantir une plus grande précision sur le terrain.
    - ⚾ L'expérience fan 2.0 : La MLB, en partenariat avec Adobe, industrialise l'engagement de ses supporters grâce à des outils de personnalisation de pointe.
    - 🏦 Prudence dans le secteur bancaire : Goldman Sachs tire la sonnette d'alarme sur la manière dont l'IA bouscule les modèles traditionnels d'évaluation du risque de crédit.
    - 📈 Une croissance exponentielle : La banque Citi a revu ses prévisions à la hausse, estimant désormais que les investissements mondiaux dans l'IA atteindront 8,9 billions de dollars.
    - 🇨🇳  L'impulsion chinoise : À Pékin, les autorités poussent activement le secteur bancaire à orienter davantage de crédits vers le développement et l'intégration des technologies d'IA.

    Lien en commentaires 👇

    #IA #Sport #Data #FanExperience #SportsAnalytics #Innovation 
    ```

    Return only the Facebook post text in plain French, without JSON or markdown.
  expected_output: >
    A French Facebook post in plain text.
  agent: facebook_post_writer
  output_file: editions/edition_{edition_number}_{edition_date}/social_facebook.txt

write_linkedin_post:
  description: >
    Write a French LinkedIn post to share Market & Match newsletter edition #{edition_number}.

    STYLE REQUIREMENTS (ALL PLATFORMS):
    - Write as someone sharing a discovery with followers, not as a press release
    - Start with a personal phrase like: "Cette semaine dans Market & Match #{edition_number},"
    - Natural, direct tone, as if sharing a discovery with your followers
    - Include a few relevant hashtags at the end

    LINKEDIN-SPECIFIC:
    - Include the placeholder [LIEN_URL] at the end
    - Include a few emojis throughout
    - 2 to 5 sentences max
    - Summarize news items as bullet points (10-20 words per news item)
    - Professional and insightful tone

    Here is an example of a good LinkedIn post:
    ```
    Cette semaine dans Market & Match #2, nous explorons comment l'IA transforme l'arbitrage du Mondial, l'engagement des fans de baseball et les modèles de crédit de Goldman Sachs à Pékin.

    ⚽ FIFA : L'organisation intègre l'IA pour optimiser la VAR, réaliser des scans 3D ultra-précis et garantir une plus grande transparence dans les décisions de jeu.
    🎥 MLB et Adobe : Ce partenariat vise à industrialiser la création de contenu pour transformer radicalement l'engagement des fans de baseball.
    🏦 Goldman Sachs : La banque souligne que l'IA bouscule désormais les méthodes de scoring de crédit et impose de nouveaux défis en matière de gouvernance.
    📈 Citi : Les analystes de Citi prévoient un volume massif de 8,9 billions de dollars d'investissements liés à l'IA d'ici 2030.
    🇨🇳 Pékin : Le gouvernement chinois mobilise des crédits bancaires massifs pour soutenir stratégiquement l'essor de l'IA sur son territoire.

    🔗 Lire l'édition complète : [LIEN_URL]

    #IA #Sport #Data #FanExperience #SportsAnalytics #Innovation 
    ```

    Return only the LinkedIn post text in plain French, without JSON or markdown.
  expected_output: >
    A French LinkedIn post in plain text.
  agent: linkedin_post_writer
  output_file: editions/edition_{edition_number}_{edition_date}/social_linkedin.txt

write_twitter_post:
  description: >
    Write a French Twitter/X post to share Market & Match newsletter edition #{edition_number}.

    STYLE REQUIREMENTS (ALL PLATFORMS):
    - Write as someone sharing a discovery with followers, not as a press release
    - Start with a personal phrase like: "Cette semaine dans Market & Match #{edition_number},"
    - Natural, direct tone, as if sharing a discovery with your followers
    - Include a few relevant hashtags at the end

    TWITTER/X-SPECIFIC:
    - 270 characters maximum
    - Include the placeholder [LIEN_URL] at the end
    - Concise and punchy

    Return only the Twitter/X post text in plain French, without JSON or markdown.
  expected_output: >
    A French Twitter/X post in plain text (270 chars max).
  agent: twitter_post_writer
  output_file: editions/edition_{edition_number}_{edition_date}/social_twitter.txt